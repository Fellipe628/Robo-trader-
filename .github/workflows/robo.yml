          elif [ "$SCHEDULE" = "0 6 * * *" ] || [ "$SCHEDULE" = "0 13 * * 1-5" ] || [ "$INPUT_TREINO" = "true" ]; then
            echo "treinar=true" >> "$GITHUB_OUTPUT"
            echo "relatorio=false" >> "$GITHUB_OUTPUT"
          else
            echo "treinar=false" >> "$GITHUB_OUTPUT"
            echo "relatorio=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Rodar robô
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TREINAR_LSTM: ${{ steps.modo.outputs.treinar }}
          MODO_RELATORIO: ${{ steps.modo.outputs.relatorio }}
        run: python robo.py

      - name: Salvar modelos LSTM v12 (cache)
        if: steps.modo.outputs.treinar == 'true' && success()
        uses: actions/cache/save@v4
        with:
          path: modelos_lstm_v12
          key: lstm-v12-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Salvar dados atualizados
        if: success()
        shell: bash
        run: |
          set -e
          git config user.name "robo-trader-bot"
          git config user.email "bot@robo-trader.local"

          for arquivo in \
            portfolio_v12.csv \
            historico_sinais_v12.csv \
            cooldowns_v12.csv \
            circuit_breaker_v12.json \
            stops_pendentes_v12.csv \
            reversoes_pendentes_v12.csv \
            telegram_state_v12.json; do
            if [ -f "$arquivo" ]; then
              git add -- "$arquivo"
            fi
          done

          if git diff --cached --quiet; then
            echo "Nenhuma alteração da v12 para salvar."
            exit 0
          fi

          git commit -m "Atualiza dados simulados v12 [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
