name: Robo Trader v12 (monitoramento)

on:
  workflow_dispatch:
    inputs:
      treinar_lstm:
        description: 'Forcar treino do LSTM?'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
  schedule:
    # Horarios UTC. Mantem a cobertura atual de monitoramento.
    - cron: '0 6 * * *'
    - cron: '0 7 * * 0'
    - cron: '0 12 * * 6'
    - cron: '0 3 * * *'
    - cron: '0 9,10 * * *'
    - cron: '0,30 11,12 * * *'
    - cron: '*/15 13-19 * * *'
    - cron: '0 20-23 * * *'
    - cron: '0 0-1 * * *'

permissions:
  contents: write

concurrency:
  group: robo-trader-${{ github.ref }}
  cancel-in-progress: false

jobs:
  robo:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Restaurar modelos LSTM v12
        uses: actions/cache/restore@v4
        with:
          path: modelos_lstm_v12
          key: lstm-v12-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            lstm-v12-${{ github.ref_name }}-

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Definir modo
        id: modo
        shell: bash
        env:
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_TREINO: ${{ inputs.treinar_lstm }}
        run: |
          # Treino automatico semanal: domingo 07:00 UTC (04:00 BRT).
          # Treino manual continua disponivel com true.
          if [ "$INPUT_TREINO" = "true" ] || [ "$SCHEDULE" = "0 7 * * 0" ]; then
            echo "treinar=true" >> "$GITHUB_OUTPUT"
          else
            echo "treinar=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "$SCHEDULE" = "0 12 * * 6" ]; then
            echo "relatorio=true" >> "$GITHUB_OUTPUT"
          else
            echo "relatorio=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Rodar robo
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APITUBE_KEY: ${{ secrets.APITUBE_KEY }}
          TREINAR_LSTM: ${{ steps.modo.outputs.treinar }}
          MODO_RELATORIO: ${{ steps.modo.outputs.relatorio }}
        run: python robo.py

      - name: Salvar modelos LSTM v12
        if: success() && steps.modo.outputs.treinar == 'true'
        uses: actions/cache/save@v4
        with:
          path: modelos_lstm_v12
          key: lstm-v12-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Salvar dados de acompanhamento
        if: success()
        shell: bash
        run: |
          set -e
          git config user.name "robo-trader-bot"
          git config user.email "bot@robo-trader.local"
          for arquivo in \
            portfolio_v12.csv \
            historico_sinais_v12.csv \
            cooldowns_v12.csv \
            circuit_breaker_v12.json \
            stops_pendentes_v12.csv \
            reversoes_pendentes_v12.csv \
            telegram_state_v12.json; do
            if [ -f "$arquivo" ]; then
              git add -- "$arquivo"
            fi
          done
          if git diff --cached --quiet; then
            echo "Nenhuma alteracao para salvar."
            exit 0
          fi
          git commit -m "Atualiza dados de acompanhamento v12 [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
