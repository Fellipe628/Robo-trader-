name: Robo Trader

on:
  schedule:
    # ⭐ Treino de CRIPTO (3h BRT, todos os dias — madrugada)
    - cron: '0 6 * * *'
    # ⭐ Treino de AÇÕES + CRIPTO (10h BRT, seg-sex, mercado aberto)
    - cron: '0 13 * * 1-5'
    # Ciclos normais do dia (modo uso)
    - cron: '0 3 * * *'
    - cron: '0 9,10 * * *'
    - cron: '0,30 11,12 * * *'
    - cron: '*/15 13-19 * * *'
    - cron: '0 20-23 * * *'
    - cron: '0 0-1 * * *'
  workflow_dispatch:
    inputs:
      treinar_lstm:
        description: 'Forçar treino do LSTM?'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write

jobs:
  robo:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Restaurar modelos LSTM (cache)
        uses: actions/cache/restore@v4
        with:
          path: modelos_lstm
          key: lstm-models-${{ github.run_number }}
          restore-keys: |
            lstm-models-

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Definir modo (treino ou uso)
        id: modo
        run: |
          SCHEDULE="${{ github.event.schedule }}"
          INPUT="${{ github.event.inputs.treinar_lstm }}"
          if [ "$SCHEDULE" = "0 6 * * *" ] || [ "$SCHEDULE" = "0 13 * * 1-5" ] || [ "$INPUT" = "true" ]; then
            echo "treinar=true" >> $GITHUB_OUTPUT
            echo "🧠 Modo TREINO ativado (schedule: $SCHEDULE)"
          else
            echo "treinar=false" >> $GITHUB_OUTPUT
            echo "📦 Modo USO (carrega modelo do cache)"
          fi

      - name: Rodar robô
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TREINAR_LSTM: ${{ steps.modo.outputs.treinar }}
        run: python robo.py

      - name: Salvar modelos LSTM (cache)
        if: steps.modo.outputs.treinar == 'true'
        uses: actions/cache/save@v4
        with:
          path: modelos_lstm
          key: lstm-models-${{ github.run_number }}

      - name: Salvar dados atualizados
        run: |
          git config user.name "robo-trader-bot"
          git config user.email "bot@robo-trader.local"
          git add portfolio.csv historico_sinais.csv cooldowns.csv circuit_breaker.json stops_pendentes.csv reversoes_pendentes.csv 2>/dev/null || true
          git commit -m "🤖 Atualiza dados [skip ci]" || echo "Sem mudanças para commitar"
          git push
