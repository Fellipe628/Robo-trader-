name: Robo Trader (v12 em desenvolvimento)

on:
  schedule:
    - cron: '0 6 * * *'
    - cron: '0 13 * * 1-5'
    - cron: '0 12 * * 6'
    - cron: '0 3 * * *'
    - cron: '0 9,10 * * *'
    - cron: '0,30 11,12 * * *'
    - cron: '*/15 13-19 * * *'
    - cron: '0 20-23 * * *'
    - cron: '0 0-1 * * *'
  workflow_dispatch:
    inputs:
      treinar_lstm:
        description: 'Forçar treino do LSTM?'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write

concurrency:
  group: robo-trader-${{ github.ref }}
  cancel-in-progress: false

jobs:
  robo:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Restaurar modelos LSTM (cache)
        uses: actions/cache/restore@v4
        with:
          path: modelos_lstm
          key: lstm-models-${{ github.run_number }}
          restore-keys: |
            lstm-models-

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Definir modo (treino / relatório / uso)
        id: modo
        env:
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_TREINO: ${{ inputs.treinar_lstm }}
        run: |
          if [ "$SCHEDULE" = "0 12 * * 6" ]; then
            echo "treinar=false" >> "$GITHUB_OUTPUT"
            echo "relatorio=true" >> "$GITHUB_OUTPUT"
          elif [ "$SCHEDULE" = "0 6 * * *" ] || [ "$SCHEDULE" = "0 13 * * 1-5" ] || [ "$INPUT_TREINO" = "true" ]; then
            echo "treinar=true" >> "$GITHUB_OUTPUT"
            echo "relatorio=false" >> "$GITHUB_OUTPUT"
          else
            echo "treinar=false" >> "$GITHUB_OUTPUT"
            echo "relatorio=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Rodar robô
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TREINAR_LSTM: ${{ steps.modo.outputs.treinar }}
          MODO_RELATORIO: ${{ steps.modo.outputs.relatorio }}
        run: python robo.py

      - name: Salvar modelos LSTM (cache)
        if: steps.modo.outputs.treinar == 'true'
        uses: actions/cache/save@v4
        with:
          path: modelos_lstm
          key: lstm-models-${{ github.run_number }}

      - name: Salvar dados atualizados
        if: success()
        shell: bash
        run: |
          set -e
          git config user.name "robo-trader-bot"
          git config user.email "bot@robo-trader.local"

          for arquivo in \
            portfolio_v12.csv \
            historico_sinais_v12.csv \
            cooldowns_v12.csv \
            circuit_breaker_v12.json \
            stops_pendentes_v12.csv \
            reversoes_pendentes_v12.csv \
            telegram_state_v12.json; do
            if [ -f "$arquivo" ]; then
              git add -- "$arquivo"
            fi
          done

          if git diff --cached --quiet; then
            echo "Nenhuma alteração da v12 para salvar."
            exit 0
          fi

          git commit -m "Atualiza dados simulados v12 [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
